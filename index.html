<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome Back | Login</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="login-card">
      <div class="logo">
        <i class="fa-solid fa-shield-halved"></i>
        <span>SecureApp</span>
      </div>

      <h2>Welcome Back</h2>
      <p class="subtitle">Please login to your account to continue</p>

      <form id="loginForm">
        <div class="form-group">
          <label>Email Address</label>
          <div class="input-box">
            <i class="fa-regular fa-envelope"></i>
            <input type="email" id="email" placeholder="you@example.com" required>
          </div>
        </div>

        <div class="form-group">
          <label>Password</label>
          <div class="input-box">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" placeholder="Enter your password" required>
            <i class="fa-regular fa-eye" id="togglePass"></i>
          </div>
        </div>

        <div class="options">
          <label class="remember"><input type="checkbox" checked> Remember me</label>
          <a href="#">Forgot Password?</a>
        </div>

        <button type="submit" class="btn-login">Sign In <i class="fa-solid fa-arrow-right"></i></button>
        <p id="msg"></p>
      </form>

      <div class="divider"><span>OR CONTINUE WITH</span></div>

      <div class="social">
        <button><i class="fa-brands fa-google"></i> Google</button>
        <button><i class="fa-brands fa-github"></i> GitHub</button>
      </div>

      <p class="signup">Don't have an account? <a href="#">Create account</a></p>
      <p class="footer">© 2026 SecureApp. Protected by 256-bit encryption.</p>
    </div>
  </div>

  <script>
    document.getElementById('togglePass').addEventListener('click', function(){
      const p = document.getElementById('password');
      p.type = p.type === 'password' ? 'text' : 'password';
    });
    document.getElementById('loginForm').addEventListener('submit', function(e){
      e.preventDefault();
      document.getElementById('msg').textContent = 'Login successful! Redirecting...';
      document.getElementById('msg').style.color = 'green';
    });
  </script>
</body>
</html>
