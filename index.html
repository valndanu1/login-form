<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Main Box -->
  <div class="box">

    <!-- Top Part -->
    <h1>Login</h1>
    <p>Welcome back!</p>

    <!-- Form Starts -->
    <form>

      <!-- Email -->
      <label>Email</label>
      <input type="email" placeholder="Enter email">

      <!-- Password -->
      <label>Password</label>
      <input type="password" placeholder="Enter password">

      <!-- Radio Buttons -->
      <p>Login As:</p>
      <label><input type="radio" name="role"> User</label>
      <label><input type="radio" name="role"> Admin</label>

      <!-- Remember + Forgot -->
      <div class="row">
        <label><input type="checkbox"> Remember me</label>
        <a href="#">Forgot?</a>
      </div>

      <!-- Button -->
      <button>Login</button>

      <!-- Bottom -->
      <p class="center">No account? <a href="#">Sign Up</a></p>

    </form>

  </div>
</body>
</html>
